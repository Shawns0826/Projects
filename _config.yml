title: "Security writing"
tagline: "Application security case studies"
description: "Technical case studies and notes on AppSec, mobile reverse engineering, and defensive design."
url: "https://shawns0826.github.io"
baseurl: "/Projects"

markdown: kramdown
highlighter: rouge
permalink: pretty
encoding: utf-8

sass:
  style: compressed

# Defined series (homepage groups posts by matching `series:` slug on each case study).
# Posts without `series` appear under "Standalone writing".
writing_series:
  - slug: broken-trust-client-controls
    title: "Broken Trust: Client-Side Controls"
    description: "Read in order or standalone—essays on client-supplied identity, enforcement, and server-side authority."
    parts_planned: 4

collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/

defaults:
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: "case_study"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/README.md
  - templates
  - projects
  - vendor
  - node_modules
