title: "Security writing"
tagline: "Application security case studies"
description: "Technical case studies and notes on AppSec, mobile reverse engineering, and defensive design."
url: "https://shawns0826.github.io"
baseurl: "/Projects"

markdown: kramdown
highlighter: rouge
permalink: pretty
encoding: utf-8

# Include collection docs dated in the future (otherwise `site.case_studies` is empty until that date).
future: true

sass:
  style: compressed

collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/

defaults:
  - scope:
      path: "_case_studies"
    values:
      layout: "case_study"
      published: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/README.md
  - templates
  - projects
  - vendor
  - node_modules
